<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Noto Sans CJK SC", sans-serif;
    background: #F7F3E6; color: #23303B; position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0; opacity: .55;
    background-image: radial-gradient(#C9D4CE 1.2px, transparent 1.3px);
    background-size: 26px 26px;
  }
  .frame { position: absolute; inset: 34px; border: 3px solid #D8D1BE; border-radius: 8px; }
  .tape { position: absolute; width: 170px; height: 44px; background: rgba(247,214,120,.55); border: 1px solid rgba(190,160,70,.25); transform: rotate(-4deg); }
  .t1 { left: 120px; top: 44px; } .t2 { right: 150px; top: 82px; transform: rotate(5deg); }
  .kicker { position: absolute; left: 112px; top: 100px; font-size: 14px; letter-spacing: .22em; color: #7C8B91; }
  h1 { position: absolute; left: 104px; top: 146px; font-size: 104px; line-height: 1.22; font-weight: 900; letter-spacing: -.02em; color: #1E2B36; }
  h1 .hi { position: relative; display: inline-block; color: #1E2B36; }
  h1 .hi::after { content: ""; position: absolute; left: -4px; right: -6px; bottom: 2px; height: 26px; background: #FFD86A; z-index: -1; transform: rotate(-1deg); }
  h1 .red { color: #D1493C; }
  .note {
    position: absolute; left: 106px; top: 470px; width: 690px; font-size: 31px; line-height: 1.75; color: #46565F;
  }
  .underline { width: 560px; height: 8px; background: #3C7DD9; opacity: .8; margin-top: 18px; border-radius: 99px; transform: rotate(-.5deg); }
  .browser {
    position: absolute; right: 100px; top: 160px; width: 720px; height: 480px; background: #fff;
    border: 5px solid #23303B; box-shadow: 12px 14px 0 rgba(35,48,59,.14); transform: rotate(1.2deg);
  }
  .bbar { height: 48px; border-bottom: 4px solid #23303B; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .dot { width: 14px; height: 14px; border: 3px solid #23303B; border-radius: 99px; }
  .url { flex: 1; margin-left: 16px; height: 22px; border-bottom: 3px solid #9FB0B8; font-family: "Noto Sans Mono CJK SC", monospace; font-size: 13px; color: #7C8B91; }
  .bcontent { padding: 30px 36px; }
  .bcontent h2 { font-size: 33px; line-height: 1.25; color: #23303B; }
  .line { height: 10px; background: #DCE4E2; margin: 14px 0; border-radius: 4px; }
  .line.s { width: 58%; }
  .pic { margin-top: 20px; height: 150px; border: 3px dashed #9FB0B8; background: #F1F5F3; position: relative; }
  .pic::after { content: "图 / 公式 / 表格"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8FA0A8; font-size: 22px; letter-spacing: .1em; }
  .arrow { position: absolute; right: 760px; top: 400px; width: 120px; height: 80px; }
  .arrow svg { width: 100%; height: 100%; }
  .outputs { position: absolute; right: 104px; top: 690px; display: flex; gap: 22px; }
  .out {
    width: 214px; padding: 22px 20px 20px; background: #FFFDF4; border: 4px solid #23303B;
    box-shadow: 8px 9px 0 rgba(35,48,59,.14); transform: rotate(-1.4deg);
  }
  .out:nth-child(2) { transform: rotate(1.6deg); }
  .out:nth-child(3) { transform: rotate(-.8deg); }
  .out b { display: block; font-size: 14px; letter-spacing: .16em; color: #D1493C; margin-bottom: 8px; }
  .out span { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 19px; color: #23303B; }
  .scribble { position: absolute; left: 96px; bottom: 92px; font-size: 27px; color: #3C7DD9; transform: rotate(-2deg); }
  .scribble::before { content: "↳ "; }
  .star { position: absolute; right: 860px; top: 118px; font-size: 62px; color: #FFD86A; transform: rotate(12deg); }
</style>
<div class="tape t1"></div><div class="tape t2"></div>
<div class="frame"></div>
<div class="kicker">EVERY ARTICLE, KEPT / webpage-archiver</div>
<h1>链接会<span class="red">失效</span>，<br>内容要<span class="hi">留下</span>。</h1>
<div class="note">图片、公式、图注和参考文献，<br>一次性保存成能离线打开的完整档案。<div class="underline"></div></div>
<div class="browser">
  <div class="bbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url">example.org/article/</div></div>
  <div class="bcontent">
    <h2>一篇值得留下的文章</h2>
    <div class="line"></div><div class="line"></div><div class="line s"></div>
    <div class="pic"></div>
  </div>
</div>
<div class="arrow"><svg viewBox="0 0 120 80" fill="none" stroke="#D1493C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40 C 40 6, 74 6, 104 38"/><path d="M88 32 L 106 40 L 94 56"/></svg></div>
<div class="star">✦</div>
<div class="outputs">
  <div class="out"><b>PLAIN TEXT</b><span>article.md</span></div>
  <div class="out"><b>PRINT</b><span>article.pdf</span></div>
  <div class="out"><b>OFFLINE</b><span>index.html</span></div>
</div>
<div class="scribble">原站样式、数学公式、本地图片，都一起带走。</div>
</html>
